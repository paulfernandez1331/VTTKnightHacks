<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battlemat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <div id="board"></div>
    </section>

    <aside class="panel">
      <h1>Battlemat</h1>
      <p id="role" class="role"></p>

      <section>
        <h2>Add to map</h2>
        <form id="import-form" class="import-form">
          <input id="import-url" class="roster-search" type="text" placeholder="D&amp;D Beyond link or character ID" autocomplete="off">
          <button type="submit">Add</button>
        </form>
        <p id="import-msg" class="import-msg" role="alert"></p>
        <input id="roster-search" class="roster-search" type="search" placeholder="Name, class, or level" autocomplete="off">
        <div id="roster" class="roster"></div>
      </section>

      <section>
        <h2>Initiative</h2>
        <div id="initiative"></div>
      </section>

      <section>
        <h2>Distance</h2>
        <p id="distance" class="distance"></p>
      </section>

      <section>
        <h2>Attack</h2>
        <div id="attack-actions" class="attack-actions"></div>
        <p id="attack-msg" class="attack-msg" role="alert"></p>
      </section>

      <section>
        <h2>Combat log</h2>
        <div id="log" class="log"></div>
      </section>

      <section>
        <h2>Selected token</h2>
        <div id="detail"></div>
      </section>
    </aside>
  </main>

  <script src="/vendor/konva/konva.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
